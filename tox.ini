[tox]
envlist = py313,lint,type,security,test
skip_missing_interpreters = True

[testenv]
description = Run unit tests
deps =
    pytest>=7.0
    pytest-cov
commands =
    pytest {posargs:tests/}

[testenv:lint]
description = Run ruff linting and formatting checks
skip_install = True
deps =
    ruff
commands =
    ruff check src/ tests/

[testenv:fmt]
description = Format code with ruff
skip_install = True
deps =
    ruff
commands =
    ruff check --fix src/ tests/

[testenv:type]
description = Run mypy type checking
deps =
    mypy
commands =
    mypy src/

[testenv:security]
description = Run security checks (bandit + ruff security rules)
skip_install = True
deps =
    bandit
    ruff
commands =
    ruff check src/ tests/ --select S
    bandit -r src/ -ll

[testenv:test]
description = Run full test suite with coverage
deps =
    pytest>=7.0
    pytest-cov
commands =
    pytest tests/ -v --cov=src/meter_reader --cov-report=html --cov-report=term

[testenv:test-security]
description = Run security-focused tests
deps =
    pytest>=7.0
commands =
    pytest tests/test_security.py -v

[testenv:check]
description = Run all checks (lint, type, security, tests)
skip_install = False
deps =
    ruff
    mypy
    bandit
    pytest>=7.0
    pytest-cov
commands =
    ruff check src/ tests/
    mypy src/
    ruff check src/ tests/ --select S
    bandit -r src/ -ll
    pytest tests/ -v --cov=src/meter_reader --cov-report=term-missing

[testenv:clean]
description = Clean up cache files
skip_install = True
allowlist_externals = 
    rm
    find
commands =
    rm -rf .ruff_cache .mypy_cache .pytest_cache .tox dist build *.egg-info
    find . -type d -name __pycache__ -exec rm -rf {{}} +
    find . -type f -name "*.pyc" -delete

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
