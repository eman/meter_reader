openapi: 3.0.0
info:
  title: EAGLE Gateway Local HTTP API
  description: |
    Documentation for the local HTTP interface of the Rainforest EAGLE gateway.
    While the official API uses a socket connection on port 5002, this interface allows for similar functionality over HTTP POST requests using XML payloads and JSON responses.
  version: 1.0.0
servers:
  - url: http://{host}
    description: Local EAGLE Gateway
    variables:
      host:
        default: eagle-000000.local
        description: Hostname or IP address of the gateway

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

security:
  - basicAuth: []

paths:
  /cgi-bin/cgi_manager:
    post:
      summary: Execute Local Commands
      description: |
        Primary endpoint for retrieving meter data and device information. 
        Requests are sent as XML wrapped in `<LocalCommand>...</LocalCommand>`.
        Responses are typically JSON.
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <LocalCommand>
                  <Name>get_usage_data</Name>
                  <MacId>0xd8d5b90000000cee</MacId>
                </LocalCommand>
      responses:
        '200':
          description: Successful response
          content:
            text/html: # The content-type might be text/html but body is JSON
              schema:
                type: object # It returns a JSON object
                example:
                  demand: "1.234"
                  demand_units: "kW"
                  summation_delivered: "12345.678"
                  meter_status: "Connected"
  
  /cgi-bin/post_manager:
    post:
      summary: Execute System Configuration Commands
      description: |
        Endpoint for system-level configuration such as mDNS, Remote Management, and Cloud settings.
        Requests are sent as XML wrapped in `<Command>...</Command>` with `<Format>JSON</Format>` for JSON responses.
        
        This endpoint provides access to:
        - mDNS (Multicast DNS) configuration for local network discovery
        - Remote management and cloud service integration
        - Gateway device configuration and firmware information
        - Network settings and time synchronization
        - SSH access control (if available)
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <Command>
                  <Name>get_mdns_status</Name>
                  <Format>JSON</Format>
                </Command>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                example:
                  mDnsStatus:
                    Enabled: "Y"
                    Hostname: "eagle-000cee"

  /cgi-bin/post_manager-get-device-config:
    post:
      summary: Get Device Configuration
      description: Get gateway device configuration including firmware, hardware, and cloud status.
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <Command>
                  <Name>get_device_config</Name>
                  <Format>JSON</Format>
                </Command>
      responses:
        '200':
          description: Device configuration response
          content:
            application/json:
              schema:
                type: object
                example:
                  FirmwareVersion: "1.4.48"
                  HardwareVersion: "2.0"
                  MacAddress: "00:11:22:33:44:55:66"

  /cgi-bin/post_manager-get-cloud-status:
    post:
      summary: Get Cloud Service Status
      description: Get cloud service connectivity and configuration status.
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <Command>
                  <Name>get_cloud_status</Name>
                  <Format>JSON</Format>
                </Command>
      responses:
        '200':
          description: Cloud status response
          content:
            application/json:
              schema:
                type: object
                example:
                  CloudStatus:
                    Connected: "Y"
                    Provider: "Rainforest"

  /cgi-bin/post_manager-get-remote-management:
    post:
      summary: Get Remote Management Status
      description: Get Rainforest Remote Management service status and settings.
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <Command>
                  <Name>get_remote_management_status</Name>
                  <Format>JSON</Format>
                </Command>
      responses:
        '200':
          description: Remote management status response
          content:
            application/json:
              schema:
                type: object
                example:
                  RemoteEnabled: "Y"
                  RemoteStatus: "Connected"
