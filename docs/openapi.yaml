openapi: 3.0.0
info:
  title: EAGLE Gateway Local HTTP API
  description: |
    Documentation for the local HTTP interface of the Rainforest EAGLE gateway.
    While the official API uses a socket connection on port 5002, this interface allows for similar functionality over HTTP POST requests using XML payloads and JSON responses.
  version: 1.0.0
servers:
  - url: http://{host}
    description: Local EAGLE Gateway
    variables:
      host:
        default: eagle-000000.local
        description: Hostname or IP address of the gateway

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

security:
  - basicAuth: []

paths:
  /cgi-bin/cgi_manager:
    post:
      summary: Execute Local Commands
      description: |
        Primary endpoint for retrieving meter data and device information. 
        Requests are sent as XML wrapped in `<LocalCommand>...</LocalCommand>`.
        Responses are typically JSON.
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              example: |
                <LocalCommand>
                  <Name>get_usage_data</Name>
                  <MacId>0xd8d5b90000000cee</MacId>
                </LocalCommand>
      responses:
        '200':
          description: Successful response
          content:
            text/html: # The content-type might be text/html but body is JSON
              schema:
                type: object # It returns a JSON object
                example:
                  demand: "1.234"
                  demand_units: "kW"
                  summation_delivered: "12345.678"
                  meter_status: "Connected"
  
  /cgi-bin/post_manager:
    post:
      summary: Execute System Configuration Commands
      description: |
        Endpoint for system-level configuration such as mDNS, Remote Management, and Cloud settings.
        Requests are sent as XML wrapped in `<Command>...</Command>` with `<Format>JSON</Format>` for JSON responses.
        
        This endpoint provides access to:
        - mDNS (Multicast DNS) configuration for local network discovery
        - Remote management and cloud service integration
        - Gateway device configuration and firmware information
        - Network settings and time synchronization
        - SSH access control (if available)
        
        The `Name` field in the XML command determines which operation to perform. Common operations:
        - get_mdns_status, set_mdns
        - get_device_config
        - get_cloud_status
        - get_remote_management_status, set_remote_management
        - get_network_info
        - get_time_status
        - get_ssh_status
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
              examples:
                get_mdns_status:
                  value: |
                    <Command>
                      <Name>get_mdns_status</Name>
                      <Format>JSON</Format>
                    </Command>
                get_device_config:
                  value: |
                    <Command>
                      <Name>get_device_config</Name>
                      <Format>JSON</Format>
                    </Command>
                get_cloud_status:
                  value: |
                    <Command>
                      <Name>get_cloud_status</Name>
                      <Format>JSON</Format>
                    </Command>
                get_remote_management_status:
                  value: |
                    <Command>
                      <Name>get_remote_management_status</Name>
                      <Format>JSON</Format>
                    </Command>
                set_mdns:
                  value: |
                    <Command>
                      <Name>set_mdns</Name>
                      <Format>JSON</Format>
                      <Enabled>Y</Enabled>
                    </Command>
      responses:
        '200':
          description: Successful response (JSON format varies by command)
          content:
            application/json:
              schema:
                type: object
              examples:
                mdns_status:
                  value:
                    mDnsStatus:
                      Enabled: "Y"
                      Hostname: "eagle-000cee"
                device_config:
                  value:
                    FirmwareVersion: "1.4.48"
                    HardwareVersion: "2.0"
                    MacAddress: "00:11:22:33:44:55:66"
                cloud_status:
                  value:
                    CloudStatus:
                      Connected: "Y"
                      Provider: "Rainforest"
                remote_management:
                  value:
                    RemoteEnabled: "Y"
                    RemoteStatus: "Connected"
