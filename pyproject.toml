[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meter-reader"
version = "2.0.0"
description = "Client library and CLI for Eagle Energy Gateway smart meter data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "typer",
    "rich",
    "requests",
    "types-requests"
]
authors = [
    {name = "Emmanuel Levijarvi", email = "emansl@gmail.com"},
]
keywords = ["energy", "electricity", "smartmeter", "HAN", "eagle"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Utilities",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/eman/meter_reader"
Repository = "https://github.com/eman/meter_reader.git"
Issues = "https://github.com/eman/meter_reader/issues"

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.0",
    "mkdocs-render-swagger-plugin",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
mr = "meter_reader.main:app"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["meter_reader"]

[tool.setuptools.package-data]
meter_reader = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.13"
pythonPlatform = "All"

[tool.coverage.run]
omit = ["src/meter_reader/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
